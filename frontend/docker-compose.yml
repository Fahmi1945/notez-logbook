version: '3.8'

services:
  notez-frontend:
    container_name: notez_frontend_app
    build: .
    ports:
      - "4000:3000" # Map port 3000 komputer ke port 3000 container
    restart: always # Otomatis menyala lagi kalau komputer/server direstart
    environment:
      - NODE_ENV=production
      # - NEXT_PUBLIC_API_URL=http://100.76.49.105:3002/api (Contoh jika butuh ENV)