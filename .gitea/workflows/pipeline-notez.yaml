# 1. Nama Pipeline Lu
name: Pipeline Utama Notez

# 2. KONDISI PEMICU (Kapan robot ini harus bekerja?)
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

# 3. DAFTAR TUGAS
jobs:
  Cek-Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kodingan Terbaru
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Frontend Dependency
        run: |
          cd frontend
          npm install

      - name: Linter Frontend
        run: |
          cd frontend
          npm run lint

      - name: Unit Test Frontend
        run: |
          cd frontend
          npm test

      - name: Test Build Frontend
        run: |
          cd frontend
          npm run build

  Cek-Backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kodingan Terbaru
        uses: actions/checkout@v3

      - name: Install Backend Dependency
        run: |
          cd backend
          npm install

      - name: Generate Prisma Client
        run: |
          cd backend
          export DATABASE_URL="mysql://palsu:palsu@localhost:3306/db_palsu" 
          npx prisma generate

      - name: Linter Backend
        run: |
          cd backend
          npm run lint

      - name: Unit Test Backend
        run: |
          cd backend
          npm test

  Cek-Keamanan:
    runs-on: ubuntu-latest
    # Menggunakan container docker semgrep agar tidak perlu install manual
    container:
      image: semgrep/semgrep
    steps:
      - name: Ambil Kodingan Terbaru
        uses: actions/checkout@v3

      - name: Scan Kode dengan Semgrep CI
        env:
          # Memanggil rahasia token dari Gitea Secrets
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        # Perintah ini otomatis scan seluruh folder (frontend & backend sekaligus)
        run: semgrep ci

  # Job Kedua: Hanya jalan kalau Job Pertama SUKSES
  Kirim-Notifikasi:
    runs-on: ubuntu-latest
    
    needs: [Cek-Frontend, Cek-Backend, Cek-Keamanan]
    
    if: always() 
    
    steps:
      - name: Laporan Sukses
        # Syarat sukses sekarang nambah: Semgrep juga harus sukses
        if: ${{ needs.Cek-Frontend.result == 'success' && needs.Cek-Backend.result == 'success' && needs.Cek-Keamanan.result == 'success' }}
        run: echo "KELAS KINGG! Pipeline aman, semua tes, linter, build, dan SCAN KEAMANAN lolos!"

      - name: Laporan Gagal
        if: ${{ contains(needs.*.result, 'failure') }}
        run: echo "Waduh bro, ada yang gagal nih (entah build atau keamanannya). Buruan cek terminal lu!"
