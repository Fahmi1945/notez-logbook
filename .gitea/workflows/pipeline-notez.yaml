# 1. Nama Pipeline Lu
name: Pipeline Utama Notez

# 2. KONDISI PEMICU (Kapan robot ini harus bekerja?)
on:
  push:
    branches:
      - main # Kondisi: Jalankan HANYA jika ada push ke branch main
    paths-ignore:
      - "README.md" # Kondisi: JANGAN jalan kalau yang diganti cuma file README.md

# 3. DAFTAR TUGAS (Apa saja yang harus dikerjakan?)
jobs:
  Cek-Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kodingan Terbaru
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # FIX: Masuk ke folder frontend dulu sebelum install & build
      - name: Install Frontend Dependency
        run: |
          cd frontend
          npm install

      - name: Test Build Frontend
        run: |
          cd frontend
          npm run build

  Cek-Backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kodingan Terbaru
        uses: actions/checkout@v3

      # Skenario jika backend lu pakai Node.js juga (Sesuaikan command running backend lu)
      - name: Install Backend Dependency
        run: |
          cd backend
          npm install
      - name: Prisma Generate
        run: |
          cd backend
          npx prisma generate

      - name: Test Build Backend
        run: |
          cd backend
          node app.js

  # Job Kedua: Hanya jalan kalau Job Pertama SUKSES
  Kirim-Notifikasi:
    runs-on: ubuntu-latest
    needs: Cek-Kodingan # Kondisi: Menunggu job 'Cek-Kodingan' selesai dulu
    steps:
      - name: Laporan Sukses
        run: echo "Mantap Fahmi! Pipeline aman, semua tes lolos!"

      # Contoh Kondisi Khusus 'if failure()'
      - name: Laporan Gagal
        if: failure() # Kondisi: Langkah ini HANYA jalan jika job sebelumnya ERROR
        run: echo "Waduh bro, build-nya gagal. Buruan cek terminal lu!"
