# 1. Nama Pipeline Lu
name: Pipeline Utama Notez

# 2. KONDISI PEMICU (Kapan robot ini harus bekerja?)
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

# 3. DAFTAR TUGAS
jobs:
  Cek-Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kodingan Terbaru
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Frontend Dependency
        run: |
          cd frontend
          npm install

      - name: Linter Frontend
        run: |
          cd frontend
          npm run lint

      - name: Unit Test Frontend
        run: |
          cd frontend
          npm test

      - name: Test Build Frontend
        run: |
          cd frontend
          npm run build

  Cek-Backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kodingan Terbaru
        uses: actions/checkout@v3

      - name: Install Backend Dependency
        run: |
          cd backend
          npm install

      - name: Linter Backend
        run: |
          cd backend
          npm run lint

      - name: Unit Test Backend
        run: |
          cd backend
          npm test

  # Job Kedua: Hanya jalan kalau Job Pertama SUKSES
  Kirim-Notifikasi:
    runs-on: ubuntu-latest
    needs: [Cek-Frontend, Cek-Backend]
    steps:
      - name: Laporan Sukses
        # Hanya mencetak ini jika Frontend DAN Backend sukses
        if: ${{ needs.Cek-Frontend.result == 'success' && needs.Cek-Backend.result == 'success' }}
        run: echo "KELAS KINGG! Pipeline aman, semua tes, linter, dan build lolos!"

      - name: Laporan Gagal
        if: failure()
        run: echo "Waduh bro, build-nya gagal. Buruan cek terminal lu!"
