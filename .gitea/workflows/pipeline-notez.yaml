# 1. Nama Pipeline Lu
name: Pipeline Utama Notez

# 2. KONDISI PEMICU (Kapan robot ini harus bekerja?)
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"

# 3. DAFTAR TUGAS
jobs:
  Cek-Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kodingan Terbaru
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependency
        run: |
          cd frontend
          npm ci

      - name: Linter Frontend
        run: |
          cd frontend
          npm run lint

      - name: Unit Test Frontend
        run: |
          cd frontend
          npm test

      - name: Test Build Frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3333/api"
        run: |
          cd frontend
          npm run build

  Cek-Backend:
      runs-on: ubuntu-latest
      steps:
        - name: Ambil Kodingan Terbaru
          uses: actions/checkout@v4

        # PERBAIKAN 1: Tambahkan Setup Node.js (Sebelumnya tidak ada di job backend)
        - name: Install Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "22.23.1"
            cache: 'npm'
            cache-dependency-path: 'backend/package-lock.json'

        - name: Install Backend Dependency
          run: |
            cd backend
            npm ci

        - name: Generate Prisma Client
          env:
            # Gunakan URL palsu agar Prisma Client bisa di-generate tanpa butuh DB asli
            DATABASE_URL: "postgresql://palsu:palsu@localhost:5432/db_palsu"
          run: |
            cd backend
            npx prisma generate

        - name: Linter Backend
          run: |
            cd backend
            npm run lint

        - name: Unit Test Backend
          env:
            # PERBAIKAN 2: Setup Dummy Environment Variables & Timezone
            TZ: UTC
            CI: true
            SUPABASE_URL: "https://dummy-url.supabase.co"
            SUPABASE_SERVICE_ROLE_KEY: "dummy-key-12345"
            DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/db_dummy"
            JWT_SECRET: "dummy-jwt-secret-123"
          run: |
            cd backend
            # PERBAIKAN 3: Menjalankan test secara runInBand khusus di CI
            npm test -- --ci --runInBand

  Cek-Keamanan:
    runs-on: ubuntu-latest
  
    steps:
      - name: Ambil Kodingan Terbaru
        uses: actions/checkout@v3
        # Step ini tidak akan error karena berjalan di mesin Ubuntu bawaan 
        # runner yang sudah ada Node.js-nya.

      - name: Scan Kode dengan Semgrep CI (Pakai Image Resmi)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -e SEMGREP_APP_TOKEN="${{ secrets.SEMGREP_APP_TOKEN }}" \
            semgrep/semgrep semgrep ci
            # ^^^ Langsung pakai image 'semgrep/semgrep' dari internet!

  # Job Kedua: Hanya jalan kalau Job Pertama SUKSES
  Kirim-Notifikasi:
    runs-on: ubuntu-latest
    
    needs: [Cek-Frontend, Cek-Backend, Cek-Keamanan]
    
    if: always() 
    
    steps:
      - name: Laporan Sukses
        # Syarat sukses sekarang nambah: Semgrep juga harus sukses
        if: ${{ needs.Cek-Frontend.result == 'success' && needs.Cek-Backend.result == 'success' && needs.Cek-Keamanan.result == 'success' }}
        run: echo "KELAS KINGG! Pipeline aman, semua tes, linter, build, dan SCAN KEAMANAN lolos!"

      - name: Laporan Gagal
        if: ${{ needs.Cek-Frontend.result != 'success' || needs.Cek-Backend.result != 'success' || needs.Cek-Keamanan.result != 'success' }}
        run: echo "Waduh bro, ada yang gagal nih (entah build atau keamanannya). Buruan cek terminal lu!"
