version: "3"

networks:
  gitea:
    external: false

services:
  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  server:
    image: gitea/gitea:latest
    container_name: gitea
    # PERBAIKAN 3: Kunci keamanan agar hacker tidak bisa naik pangkat jadi root
    security_opt:
      - no-new-privileges:true
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=notez_db
      - GITEA__database__USER=notez_user
      - GITEA__database__PASSWD=notez123
    restart: always
    networks:
      - gitea
    volumes:
      - ./gitea:/data
    ports:
      - "3000:3000"
      - "222:22"
    depends_on:
      - db

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  db:
    image: postgres:14
    container_name: gitea_db
    # PERBAIKAN 3: Kunci keamanan agar hacker tidak bisa naik pangkat jadi root
    security_opt:
      - no-new-privileges:true
    restart: always
    environment:
      - POSTGRES_USER=notez_user
      - POSTGRES_PASSWORD=notez123 # Harus SAMA dengan PASSWD di atas
      - POSTGRES_DB=notez_db
    ports:
      - "5433:5432"
    networks:
      - gitea
    volumes:
      - ./postgres:/var/lib/postgresql/data

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gitea
    # PERBAIKAN 3: Kunci keamanan agar hacker tidak bisa naik pangkat jadi root
    security_opt:
      - no-new-privileges:true
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com # Email untuk login pgAdmin
      PGADMIN_DEFAULT_PASSWORD: admin # Password untuk login pgAdmin
    ports:
      - "5050:80" # Akses dari browser lewat port 5050
    networks:
      - gitea
    depends_on:
      - db
    volumes:
      - ./pgadmin:/var/lib/pgadmin

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  act_runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    # PERBAIKAN 3: Kunci keamanan agar hacker tidak bisa naik pangkat jadi root
    security_opt:
      - no-new-privileges:true
    environment:
      # Tetap gunakan IP Address komputer lu
      - GITEA_INSTANCE_URL=http://host.docker.internal:3000
      # Paste token yang lu dapet dari Gitea
      - GITEA_RUNNER_REGISTRATION_TOKEN=8advyAO4tgQz2ftgcg0qRmZnSLvXc65inU2jeA7K
      - GITEA_RUNNER_NAME=git-runner
    # nosemgrep: yaml.docker-compose.security.exposing-docker-socket-volume.exposing-docker-socket-volume
    volumes:
     # Wajib untuk Docker out of Docker (DooD)
      - /var/run/docker.sock:/var/run/docker.sock
      # Bedakan nama folder data-nya agar tidak bentrok dengan Gitea
      - ./runner-data:/data
      - ./config.yaml:/config.yaml
    restart: always